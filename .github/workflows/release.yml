# Builds the installers and update packages for a version tag (v1.2.3) and publishes them as a
# GitHub release, which is where installed copies look for updates (docs/architecture.md#updates).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true

jobs:
  package:
    # The channel is the runtime id: it is part of every file name, so both platforms fit in one
    # release, and an installed copy only looks at the channel it was packaged with.
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            exe: Ignite.exe
            icon: src/Ignite.App/Assets/Icons/ignite.ico
          - os: ubuntu-latest
            rid: linux-x64
            exe: Ignite
            icon: src/Ignite.App/Assets/Icons/ignite-256.png
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish
        run: dotnet publish src/Ignite.App/Ignite.App.csproj -c Release -r ${{ matrix.rid }} --self-contained -warnaserror -p:Version=$VERSION -o publish
      # The previous release lets vpk build a delta package, so updates download only what changed.
      - name: Download the previous release
        run: dotnet vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --channel ${{ matrix.rid }} --token ${{ secrets.GITHUB_TOKEN }} -o releases
      - name: Package
        run: >
          dotnet vpk pack --packId Ignite --packTitle Ignite --packVersion $VERSION
          --runtime ${{ matrix.rid }} --channel ${{ matrix.rid }}
          --packDir publish --mainExe ${{ matrix.exe }} --icon ${{ matrix.icon }} -o releases
      - uses: actions/upload-artifact@v7
        with:
          name: releases-${{ matrix.rid }}
          path: releases

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - uses: actions/download-artifact@v8
        with:
          pattern: releases-*
          path: releases
          merge-multiple: true
      - name: Upload to the GitHub release
        run: |
          for channel in win-x64 linux-x64; do
            dotnet vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} \
              --channel $channel --tag $GITHUB_REF_NAME --releaseName "Ignite ${GITHUB_REF_NAME#v}" --publish --merge -o releases
          done
